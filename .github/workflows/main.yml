name: temp Build Executables

on:
  workflow_dispatch:  # 手动触发工作流

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Windows
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          sh build-release.sh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CursorPro-Windows
          path: dist/CursorPro-Windows.exe

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build macOS ARM64
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          mkdir -p dist
          go build -o dist/CursorPro-MacOS-ARM64

      - name: Upload MacOS ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: CursorPro-MacOS-ARM64
          path: dist/CursorPro-MacOS-ARM64

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Linux
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -o dist/CursorPro-Linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: CursorPro-Linux
          path: dist/CursorPro-Linux

  build-macos-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build MacOS Intel
        env:
          GOOS: darwin
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -o dist/CursorPro-MacOS-Intel

      - name: Upload MacOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: CursorPro-MacOS-Intel
          path: dist/CursorPro-MacOS-Intel

  create-release:
    needs: [build-windows, build-macos-arm64, build-linux, build-macos-intel]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          mkdir -p release
          mv artifacts/CursorPro-Windows/CursorPro-Windows.exe release/
          mv artifacts/CursorPro-MacOS-ARM64/CursorPro-MacOS-ARM64 release/
          mv artifacts/CursorPro-Linux/CursorPro-Linux release/
          mv artifacts/CursorPro-MacOS-Intel/CursorPro-MacOS-Intel release/
          
          cd release
          zip -j CursorPro-Windows.zip CursorPro-Windows.exe
          zip -j CursorPro-MacOS-ARM64.zip CursorPro-MacOS-ARM64
          zip -j CursorPro-Linux.zip CursorPro-Linux
          zip -j CursorPro-MacOS-Intel.zip CursorPro-MacOS-Intel

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/CursorPro-Windows.zip
            release/CursorPro-MacOS-ARM64.zip
            release/CursorPro-Linux.zip
            release/CursorPro-MacOS-Intel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
